name: CI

# Every push to master and every pull request: papiertool check (odin check -vet of the program and the tool, the unit tests,
# a release build), then papiertool live, in the flake's shell (the real program in a headless sway: the clipboard through wl-clipboard, the window
# over the DevTools protocol, rendered by Mesa's lavapipe). The program is kept as an artifact.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Linux: the flake's development shell (nix develop), as on a developer's machine: Odin, cargo, sway, wl-clipboard,
  # Mesa's lavapipe, from the NixOS cache. No distribution's package mirror in the way.
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # (the toolkit's text library: cargo's target directory, keyed by its sources)
      - uses: actions/cache@v4
        with:
          path: ext/gui_toolkit/build/text
          key: text-linux-nix-${{ hashFiles('ext/gui_toolkit/native/text/**', 'flake.lock') }}

      # (the shell's dbus reads its session bus's configuration where NixOS keeps it, /etc/dbus-1, which this runner does not
      # have: a session bus of its own for sway's dbus-run-session)
      - name: dbus's session configuration
        run: |
          sudo mkdir -p /etc/dbus-1
          sudo tee /etc/dbus-1/session.conf >/dev/null <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF

      - name: papiertool check, live
        run: |
          nix develop --command sh -c '
            set -e
            mkdir -p build
            odin build tools/papiertool -collection:gt=ext/gui_toolkit/src -out:build/papiertool -vet
            build/papiertool check
            build/papiertool live --keep
          '

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papier-linux-x64-${{ github.sha }}
          path: |
            build/papier
            build/live/*.log
            build/live/*.png
          if-no-files-found: warn

  # Windows: odin check -vet, the unit tests (the system's clipboard history, turned on for the runner's user, read and
  # changed through the Windows Runtime), a release build of the windows subsystem, the archive.
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./ext/gui_toolkit/.github/actions/setup-odin

      - name: The clipboard history on
        shell: pwsh
        run: |
          New-Item -Path HKCU:\Software\Microsoft\Clipboard -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\Microsoft\Clipboard -Name EnableClipboardHistory -Value 1 -Type DWord
          # (the user's clipboard service reads the setting at its start: started again, it takes it; a runner's session
          # may still have none, and the test says so)
          Get-Service cbdhsvc_* -ErrorAction SilentlyContinue | ForEach-Object { Restart-Service $_.Name -Force -ErrorAction Continue }

      - name: papiertool check, package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/papiertool -collection:gt=ext/gui_toolkit/src -out:build/papiertool.exe -vet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/papiertool.exe check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/papiertool.exe package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: papier-windows-x64-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: warn
