name: Release

# A version tag vX.Y.Z (papiertool ship makes it) builds papier and publishes it: the Linux and the Windows archives, each
# with its SHA-256, the programs alone and their update manifests signed by the secret UPDATE_SIGNING_KEY (what installed
# copies update themselves from), on a GitHub release whose notes are the changelog's section of that version. The Linux job makes the
# release; the Windows job adds its archive. The tag must be APP_VERSION's (papiertool package checks).
on:
  push:
    tags: ['v*']
  # (by hand: the archives built and kept as artifacts, nothing published, to try the workflow on a branch)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux: built in Debian 12 (glibc 2.36): the archive starts on Debian 12, Ubuntu 22.04 and later, and the distributions of
  # their age; its packages come from deb.debian.org, not from one distribution's mirror on the runner.
  release:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 40
    steps:
      - name: git, curl, the GitHub CLI, Rust
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates curl jq gh binutils xz-utils >/dev/null
          git config --global --add safe.directory '*'
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-odin-linux

      - name: Build and test
        run: |
          odin build tools/papiertool -collection:gt=ext/gui_toolkit/src -out:build/papiertool -vet
          build/papiertool check

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: build/papiertool package ${{ github.ref_name }}

      - name: Package (a try, unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: build/papiertool package

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: papier-linux-x64-try
          path: build/dist/*

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build/papiertool notes ${{ github.ref_name }} > build/notes.md
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" build/dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" build/dist/* --title "papier ${GITHUB_REF_NAME#v}" --notes-file build/notes.md
          fi

  windows:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./ext/gui_toolkit/.github/actions/setup-odin

      - name: The clipboard history on
        shell: pwsh
        run: |
          New-Item -Path HKCU:\Software\Microsoft\Clipboard -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\Microsoft\Clipboard -Name EnableClipboardHistory -Value 1 -Type DWord

      - name: Build, test, package
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/papiertool -collection:gt=ext/gui_toolkit/src -out:build/papiertool.exe -vet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/papiertool.exe check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          build/papiertool.exe package ${{ github.ref_name }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem build/dist/*).FullName --clobber
